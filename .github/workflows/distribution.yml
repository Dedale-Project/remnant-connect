name: Distribution and MCP contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate:distribution
      - run: npm run validate:plugin
      - run: npm run test:bridge
      - run: node --test test/read-catalog.test.mjs
      - run: node --import tsx --test test/adapter-compatibility.test.mjs test/adapter-matrix.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Adapter source-function fixtures (not native framework certification)
        run: python -B test/adapter_compatibility_test.py
      - name: Install the named historical SDK outside the project
        run: npm install --prefix "$RUNNER_TEMP/remnant-historical-sdk" --no-save --ignore-scripts @modelcontextprotocol/sdk@1.30.0
      - name: Check current and historical Read clients with offline fixtures
        env:
          REMNANT_HISTORICAL_SDK_ROOT: ${{ runner.temp }}/remnant-historical-sdk/node_modules/@modelcontextprotocol/sdk
        run: npm run test:read-contract
      - run: npm run test:feedback
      - run: node --import tsx --test examples/remote-mcp/test_client_evidence.ts
      - run: node --import tsx --test examples/remote-mcp/test_search_guard.ts
      - run: npm run test:close-loop
      - name: Reproduce the committed portable archive
        run: |
          npm run build:plugin
          git diff --exit-code -- plugins/remnant releases
      - name: Build Glama container
        run: docker build --tag remnant-read-glama:test .
