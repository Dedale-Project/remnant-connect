name: Codex plugin contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-codex-plugin.mjs
      - run: npm ci
      - run: npm run test:feedback
      - run: npm run test:close-loop
      - run: npm run test:agent
      - run: npm run build:agent
      - run: node scripts/validate-agent-plugin.mjs
      - run: git diff --exit-code -- plugins/remnant-agent releases
