name: AutoGen anonymous read example
on:
  push:
    paths:
      - 'examples/autogen-remnant/**'
      - '.github/workflows/autogen-read.yml'
  pull_request:
    paths:
      - 'examples/autogen-remnant/**'
      - '.github/workflows/autogen-read.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: examples/autogen-remnant
      - run: python -m pip check
        working-directory: examples/autogen-remnant
      - run: python -m unittest discover -s . -p "test_remnant_*.py" -v
        working-directory: examples/autogen-remnant
