name: Pydantic AI anonymous read example
on:
  push:
    paths:
      - 'examples/pydantic-remnant/**'
      - '.github/workflows/pydantic-read.yml'
  pull_request:
    paths:
      - 'examples/pydantic-remnant/**'
      - '.github/workflows/pydantic-read.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pydantic-ai-slim[mcp]==2.54.0" "fastmcp-slim[client]==4.0.10"
        working-directory: examples/pydantic-remnant
      - run: python -m pip check
        working-directory: examples/pydantic-remnant
      - run: python -m unittest discover -s . -p "test_remnant_*.py" -v
        working-directory: examples/pydantic-remnant
