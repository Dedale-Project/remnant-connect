name: LangGraph anonymous read example
on:
  push:
    paths:
      - 'examples/langgraph-remnant/**'
      - '.github/workflows/langgraph-read.yml'
  pull_request:
    paths:
      - 'examples/langgraph-remnant/**'
      - '.github/workflows/langgraph-read.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-search.txt
        working-directory: examples/langgraph-remnant
      - run: python -m unittest discover -s . -p "test_remnant_*.py" -v
        working-directory: examples/langgraph-remnant
